<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9ebf4" />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="Ouvre des boosters de cartes numérotées, complète ton album par rareté et échange avec les autres joueurs. Chaque carte n’existe qu’en un seul exemplaire." />
    <meta name="robots" content="%VITE_ROBOTS%" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Icônes : des fichiers (Google n'affiche pas les icônes intégrées en data:) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Aperçu lors d'un partage (réseaux sociaux, messageries) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="1/1 Cards" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="Ouvre des boosters de cartes numérotées, complète ton album par rareté et échange avec les autres joueurs. Chaque carte n’existe qu’en un seul exemplaire." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="1/1 Cards : des cartes numérotées Commune, Unique et Rare" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_APP_TITLE%" />
    <meta name="twitter:description" content="Ouvre des boosters de cartes numérotées, complète ton album par rareté et échange avec les autres joueurs." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Données structurées -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "1/1 Cards",
            "inLanguage": "fr-FR",
            "description": "Jeu de collection en ligne : boosters de cartes numérotées, album par rareté et marché entre joueurs."
          },
          {
            "@type": "WebApplication",
            "@id": "%VITE_SITE_URL%/#app",
            "url": "%VITE_SITE_URL%/",
            "name": "1/1 Cards",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Tous (navigateur web)",
            "inLanguage": "fr-FR",
            "isPartOf": { "@id": "%VITE_SITE_URL%/#website" },
            "image": "%VITE_SITE_URL%/og-image.png",
            "description": "Ouvre des boosters de cartes numérotées, chacune en un seul exemplaire, complète ton album par rareté, vends et échange tes cartes."
          }
        ]
      }
    </script>

    <!-- Évite l'affichage furtif de la page d'accueil pour un joueur déjà connecté -->
    <script>try { if (localStorage.getItem('%VITE_AUTH_STORAGE_KEY%')) document.documentElement.className += ' has-session' } catch (e) {}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>1/1 Cards est un jeu de collection en ligne : active JavaScript dans ton navigateur pour ouvrir des boosters de cartes numérotées.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
